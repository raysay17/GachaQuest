name: ci

on:
  push:
    branches: [dev, main, "feat/**", "fix/**"]
  pull_request:
    branches: [dev, main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          make clean
          make 2>&1 | tee make.log
          test -x bin/game

      - name: Test
        run: |
          set +e
          make test 2>&1 | tee test.log
          set -e
          summary=$(grep -E '^=== Ringkasan:' test.log | tail -1)
          echo "$summary"
          # Baseline scaffold: 23 cek, 3 lulus, 20 gagal. Ganti angka ini
          # setelah modul P1-P5 digabung dan hasilnya berubah.
          test "$summary" = "=== Ringkasan: 3 lulus, 20 gagal ==="
